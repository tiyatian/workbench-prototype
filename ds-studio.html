<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Studio</title><link rel="stylesheet" href="ds-studio.css"><style>
:root{--accent:#eb5b42;--ink:#202124;--muted:#92939a;--line:#e7e6e3;--soft:#f0efec;--panel:#faf9f7;--canvas:#eeece8}*{border-color:var(--line)}body{background:#f6f5f2;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app-header{height:68px;padding:0 24px;background:rgba(255,255,255,.94);border-bottom:1px solid #dddcd8;gap:18px}.back{width:26px;color:#77787d;font-size:27px}.wordmark{font-size:15px;letter-spacing:.04em}.wordmark span{font-weight:400;color:#9b9c9f}.app-header #document-name{max-width:240px;height:34px;padding:5px 10px;font-size:13px;background:transparent;border:1px solid transparent}.app-header #document-name:focus{background:#fff;border-color:#d9d8d5}.app-header #save-status{border-left:0;padding-left:0;font-size:10px;color:#a2a3a8}.header-actions{gap:5px}.header-actions button{height:34px;min-height:34px;border-radius:6px;background:transparent;border-color:transparent;color:#77787d;font-size:12px}.header-actions button:hover{background:#f0efec;color:#393a3f}.header-actions #present{border-color:#dbdad7;background:#fff;color:#3e3f43}.header-actions #export{background:#242529;border-color:#242529;color:#fff}.studio{grid-template-columns:246px minmax(0,1fr) 300px;height:calc(100dvh - 68px);background:var(--canvas)}.library{padding:22px 16px;background:rgba(250,249,247,.94);border-right:1px solid #dddcd8;gap:10px}.section-heading{padding:0 3px}.section-heading h2{color:#717279;font-size:10px;letter-spacing:.09em}.section-heading button{width:30px;height:30px;border-radius:50%;font-size:17px;color:#8b8c91}.section-heading button:hover{background:#efeeeb}.library-item{border-radius:8px;padding:10px 11px;margin:0;border:1px solid transparent}.library-item:hover{background:#f1f0ed}.library-item.selected{background:#f9e9e4;border-color:#f2cdc4;color:#b14a37}.library-item strong{font-size:12px;font-weight:600}.library-item small{font-size:10px}.library-actions{gap:7px}.library-actions button{height:30px;min-height:30px;border-color:#deddd9;background:#fff;border-radius:6px;font-size:10px}.boards-heading{padding-top:20px;margin-top:10px}.board-mini{width:42px;height:52px;border-radius:4px;background:#f0efed}.use-ds{height:38px;min-height:38px;border-radius:7px;background:#242529;border-color:#242529;font-size:12px;letter-spacing:.01em}.use-ds:hover{background:#3b3c40}.library-bottom{padding-top:25px}.workspace{background:var(--canvas)}.canvas-toolbar{min-height:54px;padding:10px 18px;background:rgba(255,255,255,.86);border-bottom:1px solid #dddcd8}.tools button,.zoom button{height:32px;min-height:32px;border-radius:6px;color:#73747a;font-size:11px}.tools button{padding:4px 9px}.tools button:hover,.zoom button:hover{background:#e8e7e4;color:#343539}.tools #add-text{color:#343539}.zoom output{color:#88898f;font-size:10px}#canvas-scroll{padding:26px 40px 66px}.board-caption{max-width:850px;margin-bottom:12px}.board-caption #board-name{font-size:12px;font-weight:600;color:#5a5b60}.board-caption #board-dimensions{font-size:10px;color:#9b9ca2}#board-wrapper{box-shadow:0 18px 44px rgba(46,45,41,.12);border:1px solid #dddcda}.canvas-footer{height:30px;background:rgba(255,255,255,.94);border-top:1px solid #dddcd8}.inspector{background:rgba(250,249,247,.97);border-left:1px solid #dddcd8}.inspector-tabs{padding:11px 13px;background:rgba(250,249,247,.97);border-bottom:1px solid #dddcd8}.inspector-tabs button{height:32px;min-height:32px;font-size:11px;color:#86878d}.inspector-tabs [aria-selected=true]{background:#e9e8e5;color:#303135}.property-section{margin-bottom:26px}.property-section h3{font-size:10px;letter-spacing:.08em;color:#898a90}.field{font-size:11px;color:#77787e}.field input,.field select,.field textarea{background:#f2f1ef;border-color:transparent;border-radius:6px}.field input:focus,.field select:focus,.field textarea:focus{background:#fff;border-color:#d6d5d1}.field input[type=color]{background:#fff;border:1px solid #deddd9}.layer{border-radius:6px;color:#66676d}.layer:hover{background:#efeeeb}.layer.selected{background:#f9e9e4;border-color:#f2cdc4;color:#a94734}.primary{background:#242529;border-color:#242529}.primary:hover{background:#3c3d41}.dialog-shell{background:#faf9f7;border-radius:10px}.dialog-options button{background:#fff;border-color:#dfdedb;border-radius:7px}.dialog-options button:hover{background:#f0efec}.presentation{background:#f6f5f2}.presentation-title{font-weight:500;letter-spacing:-.01em}.presentation img{border-radius:3px;box-shadow:0 14px 34px rgba(46,45,41,.12)}
@media(max-width:1100px){.studio{grid-template-columns:200px minmax(0,1fr) 256px}.library{padding:18px 12px}.app-header{padding:0 16px;gap:12px}.ds-topnav{display:none}}
@media(max-width:760px){.app-header{height:auto;min-height:66px;padding:10px 14px}.studio{height:auto}.library{padding:14px 12px}.workspace{height:540px}.inspector{border-left:0;border-top:1px solid #dddcd8}#canvas-scroll{padding:20px 16px 45px}}
.ds-topnav{display:flex;align-items:center;gap:4px;margin-left:auto;margin-right:8px}.ds-topnav button{min-height:30px;border:0;border-radius:999px;padding:4px 13px;background:transparent;color:#96979c;font-size:11px}.ds-topnav button:hover,.ds-topnav button.selected{background:#f0efec;color:#343539}.app-header .header-actions{margin-left:0}
</style><link rel="stylesheet" href="ds-focus.css"></head>
<body>
<header class="app-header"><a class="back" href="workbench-v042-additions.html#assets" title="返回 Assets" aria-label="返回 Assets">‹</a><b class="wordmark">DS<span>Studio</span></b><input id="document-name" aria-label="DS 名称" placeholder="未命名 DS" maxlength="120"><nav class="ds-topnav" aria-label="DS 工作区"><button class="selected">视觉方案</button><button>风格规则</button><button>资产</button></nav><span id="save-status" role="status">正在打开</span><div class="header-actions"><button id="undo" title="撤销" aria-label="撤销">↶</button><button id="redo" title="重做" aria-label="重做">↷</button><button id="present">提案预览</button><button id="export">导出</button></div></header>
<div class="studio">
<aside class="library"><div class="section-heading"><h2>Design System</h2><button id="new-document" title="新建 DS" aria-label="新建 DS">＋</button></div><div id="documents"></div><div class="library-actions"><button id="import">导入备份</button><button id="duplicate">复制 DS</button></div><div class="section-heading boards-heading"><h2>视觉方案</h2><button id="add-board" aria-label="新增画板" title="新增画板">＋</button></div><div id="boards"></div><button class="use-ds" id="reuse">使用此 DS 创作</button><div class="library-bottom"><button id="delete-document" class="danger">删除 DS</button><span>本机保存</span></div></aside>
<main class="workspace"><div class="canvas-toolbar"><div class="tools"><button id="add-text">T <span>文字</span></button><button id="add-rect" title="添加矩形">□ <span>矩形</span></button><button id="add-ellipse" title="添加圆形">○ <span>圆形</span></button><button id="add-image">上传图片</button></div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应</button></div></div><div id="canvas-scroll"><div class="board-caption"><input id="board-name" aria-label="画板名称" maxlength="120"><span id="board-dimensions"></span></div><div id="board-wrapper"><svg id="artboard" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可编辑设计画板" tabindex="0"></svg></div></div><footer class="canvas-footer"><span id="selection-status">未选择元素</span><span id="version-status"></span></footer></main>
<aside class="inspector"><div class="inspector-tabs" role="tablist"><button role="tab" id="style-tab" aria-selected="true">DS 风格</button><button role="tab" id="element-tab" aria-selected="false">元素</button></div><div id="inspector-content"></div></aside>
</div>
<div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><form method="dialog" class="dialog-shell"><header><h2 id="dialog-title"></h2><button value="cancel" class="close" aria-label="关闭">×</button></header><div id="dialog-content"></div></form></dialog>
<input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input type="file" id="json-file" accept=".json,application/json" hidden>
<script src="lucide.min.js"></script><script src="pdf-lib.min.js"></script><script src="heytea-ds.js"></script><script src="heytea-vi-proposal.js"></script><script src="ds-data.js"></script><script src="ds-vi.js"></script><script src="ds-studio.js"></script>
</body></html>
