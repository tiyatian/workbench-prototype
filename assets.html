<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assets</title><link rel="stylesheet" href="assets.css"></head><body>
<main><header class="assets-head"><div><span class="eyebrow">YOUR CREATIVE LIBRARY</span><h1>Assets<span>.</span></h1></div><div class="actions"><button id="new-folder">新建文件夹</button><button id="website">解析网站</button><button id="upload">上传素材</button><button id="start" class="primary" disabled>开始设计</button></div></header>
<nav class="asset-tabs"><button data-tab="group" class="active">Group <small id="file-count">0</small></button><button data-tab="ds">Design System <small id="ds-count">0</small></button><input id="search" type="search" placeholder="搜索素材" aria-label="搜索素材"></nav>
<div id="selection-actions" hidden role="toolbar" aria-label="所选素材操作"><button id="clear-selection" title="取消选择" aria-label="取消选择"><i data-lucide="x"></i></button><span id="selected-count" role="status"></span><button id="select-all">全选</button><button id="analyze-selected">解析为 DS</button><button id="rename" title="重命名" aria-label="重命名"><i data-lucide="pencil"></i></button><button id="move"><i data-lucide="folder-input"></i>移动</button><button id="download" title="下载原文件" aria-label="下载原文件"><i data-lucide="download"></i></button><button id="delete" class="danger"><i data-lucide="trash-2"></i>删除</button></div>
<section id="group-view"><div id="folder-breadcrumb"></div><div id="group-grid" class="grid"><div id="folder-grid"></div><div id="file-grid"></div></div><div id="empty" class="empty"><span class="empty-symbol">＋</span><h2>你的素材，从这里开始</h2><p>上传图片、设计稿或其他文件</p><button id="empty-upload">上传素材</button></div></section>
<section id="ds-view" hidden><div id="ds-grid" class="grid"></div></section>
<button id="ai-config" class="ai-status">AI 解析 · 待接入</button>
</main><input id="file-input" type="file" multiple hidden><dialog id="asset-dialog"><header><h2 id="modal-title"></h2><button id="close-modal" aria-label="关闭">×</button></header><div id="modal-body"></div></dialog><div id="message" role="status" aria-live="polite"></div>
<script src="heytea-ds.js"></script><script src="heytea-vi-proposal.js"></script><script src="ds-data.js"></script><script src="ds-vi.js"></script><script src="lucide.min.js"></script><script src="assets.js"></script></body></html>
